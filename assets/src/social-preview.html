<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0e2a2e;--bg2:#12363b;--sand:#e8c58a;--ink:#f3ead9;--muted:#9fb8b4;--code:#0a1f22}
  *{margin:0;box-sizing:border-box}
  html,body{width:1280px;height:640px;overflow:hidden;background:var(--bg)}
  body{font-family:Archivo,system-ui,sans-serif;color:var(--ink);position:relative}
  .shot{position:absolute;right:0;top:0;width:620px;height:640px;background:url(../hero.jpg) center/cover}
  .shot::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 0%,rgba(14,42,46,.55) 22%,rgba(14,42,46,0) 45%)}
  .left{position:absolute;left:72px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center;gap:26px}
  .brand{display:flex;align-items:center;gap:22px}
  .brand img{width:92px;height:92px;border-radius:50%}
  h1{font-weight:800;font-size:76px;letter-spacing:-1.5px;line-height:1}
  h1 span{color:var(--sand)}
  .tag{font-size:34px;font-weight:500;line-height:1.25;color:var(--ink);max-width:600px}
  .chips{display:flex;gap:10px;flex-wrap:nowrap}
  .chips b{font:500 17px "JetBrains Mono",monospace;color:var(--sand);border:1.5px solid rgba(232,197,138,.45);padding:6px 12px;border-radius:999px}
  .pip{font:500 22px "JetBrains Mono",monospace;color:var(--muted)}
  .pip i{font-style:normal;color:var(--sand)}
  .code{position:absolute;right:56px;bottom:56px;background:rgba(10,31,34,.92);border:1px solid rgba(232,197,138,.35);border-radius:14px;padding:20px 24px;font:500 20px/1.55 "JetBrains Mono",monospace;color:var(--ink);box-shadow:0 18px 40px rgba(0,0,0,.45)}
  .code .k{color:var(--sand)} .code .s{color:#9fd3b8} .code .c{color:var(--muted)}
  .foot{position:absolute;left:72px;bottom:34px;font:500 16px Archivo,sans-serif;color:var(--muted)}
</style></head><body>
<div class="shot"></div>
<div class="left">
  <div class="brand"><img src="../mark.png" alt=""><h1>crusader<span>-sdk</span></h1></div>
  <div class="tag">Play Stronghold Crusader from Python or MCP.</div>
  <div class="chips"><b>typed SDK</b><b>REST + MCP</b><b>game rules intact</b><b>replayable</b></div>
  <div class="pip">$ <i>pip install --pre crusader-sdk</i></div>
</div>
<div class="code"><span class="k">game</span>.build(<span class="s">"granary"</span>, x, y)<br><span class="k">game</span>.set_tax(<span class="s">2</span>)<br><span class="k">game</span>.advance(<span class="s">800</span>)  <span class="c"># one month</span></div>
<div class="foot">Unofficial · for Stronghold Crusader HD 1.41 · not affiliated with Firefly Studios</div>
</body></html>
