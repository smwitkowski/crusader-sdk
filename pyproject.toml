[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crusader-sdk"
version = "0.1.0a1"
description = "A Python SDK for Stronghold Crusader."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Stephen Witkowski" }]
dependencies = []

[project.scripts]
crusader-bridge = "crusader.bridge.server:main"

[project.optional-dependencies]
bridge = ["mcp==2.3.0", "starlette", "uvicorn"]
dev = ["ruff", "pyright", "pytest", "pytest-cov", "pre-commit", "httpx"]

[tool.hatch.build.targets.wheel]
packages = ["src/crusader"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src"]
strict = ["src/crusader/__init__.py", "src/crusader/commands.py", "src/crusader/types.py"]
pythonVersion = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
